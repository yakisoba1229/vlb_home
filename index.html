<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d2c">
  <title>プランクトンのたまご</title>
  <link rel="stylesheet" href="style.css?v=20261124-12">
</head>
<body>
  <main class="site">
    <header class="topbar">
      <div class="team-mark">🌙</div>
      <div class="brand-text"><h1>プランクトンのたまご</h1><p>BASEBALL CLUB</p></div>
      <button class="menu" aria-label="メニュー" id="menuBtn">☰</button>
    </header>

    <section class="stadium-wrap" aria-label="球場ホーム画面">
      <section class="sky-panel" id="skyPanel" aria-label="天候・時間情報">
        <div class="sky-date-time"><div id="realDate">--</div><div id="realClock">--:--</div></div>
        <div class="sky-scene" id="skyScene" aria-label="ランダムな天候と昼夜の演出">
          <div class="sun-rays"></div><div class="sun-or-moon" id="sunMoon"></div>
          <div class="cloud cloud-one"></div><div class="cloud cloud-two"></div>
          <div class="weather-particles" id="weatherParticles"></div>
          <div class="sky-stars" id="skyStars"></div>
        </div>
        <div class="sky-caption"><span id="weatherName">晴れ</span><span id="dayNightName">昼</span></div>
        <div class="vlb-year" id="vlbYear">VLB 544年</div>
      </section>

      <div class="stadium" id="stadium" aria-label="球場と選手"></div>
      <div class="stadium-footer"><div class="footer-caption">プランクトンのたまご</div></div>
    </section>


    <nav class="bottom-nav">
      <button class="active" data-page="ホーム">🏟️<small>ホーム</small></button>
      <button data-page="選手一覧">👥<small>選手</small></button>
      <button data-page="チーム">📋<small>チーム</small></button>
      <button data-page="成績">📊<small>成績</small></button>
      <button data-page="記録">📖<small>記録</small></button>
    </nav>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=20261124-12"></script>
</body>
</html>
