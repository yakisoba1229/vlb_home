
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d2c">
  <title>プランクトンのたまご</title>
  <link rel="stylesheet" href="style.css?v=20261124-10">
</head>
<body>
  <main class="site">
    <header class="topbar">
      <div class="team-mark">🌙</div>
      <div>
        <h1>プランクトンのたまご</h1>
        <p>BASEBALL CLUB</p>
      </div>
      <button class="menu" aria-label="メニュー" id="menuBtn">☰</button>
    </header>

    <section class="stadium-wrap" aria-label="球場ホーム画面">

      <!-- 上部：時間・天候・VLB情報 -->
      <div class="sky-panel" id="skyPanel">
        <div class="sky-info">
          <div class="sky-date" id="realDate">--</div>
          <div class="sky-clock" id="realClock">--:--</div>
        </div>

        <div class="weather-area" id="weatherArea">
          <div class="weather-animation" id="weatherAnimation">
            <span class="weather-main" id="weatherMain">☀️</span>
            <span class="weather-cloud" id="weatherCloud"></span>
            <span class="weather-rain" id="weatherRain"></span>
          </div>

          <div class="weather-text">
            <span id="weatherName">晴れ</span>
            <span id="dayNight">DAY</span>
          </div>
        </div>

        <div class="vlb-info">
          <div class="vlb-year" id="vlbYear">VLB年 未設定</div>
          <button class="small-button" id="yearBtn">年を設定</button>
        </div>
      </div>

      <!-- 球場 -->
      <div class="stadium" id="stadium"></div>

      <!-- 下部：球場メッセージと操作 -->
      <div class="stadium-footer">
        <div class="stadium-message" id="stadiumMessage">
          プランクトンのたまご
        </div>

        <div class="stadium-controls">
          <button id="rerollBtn">🔄 配置変更</button>
          <button id="weatherBtn">🌤 天候変更</button>
        </div>
      </div>

    </section>

    <nav class="bottom-nav">
      <button class="active" data-page="ホーム">🏟️<small>ホーム</small></button>
      <button data-page="選手一覧">👥<small>選手</small></button>
      <button data-page="チーム">📋<small>チーム</small></button>
      <button data-page="成績">📊<small>成績</small></button>
      <button data-page="記録">📖<small>記録</small></button>
    </nav>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=20261124-10"></script>
</body>
</html>
