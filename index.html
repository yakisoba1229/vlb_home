<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d2c">
  <title>プランクトンのたまご</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site">
    <header class="topbar">
      <div class="team-mark">🌙</div>
      <div><h1>プランクトンのたまご</h1><p>BASEBALL CLUB</p></div>
      <button class="menu" aria-label="メニュー" id="menuBtn">☰</button>
    </header>
    <section class="stadium-wrap" aria-label="球場ホーム画面">
      <div class="stadium" id="stadium">
        <div class="player p-cf" data-player="中堅手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>中堅手</span></div>
        <div class="player p-lf" data-player="左翼手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>左翼手</span></div>
        <div class="player p-rf" data-player="右翼手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>右翼手</span></div>
        <div class="player p-ss" data-player="遊撃手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>遊撃手</span></div>
        <div class="player p-2b" data-player="二塁手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>二塁手</span></div>
        <div class="player p-3b" data-player="三塁手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>三塁手</span></div>
        <div class="player p-1b" data-player="一塁手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>一塁手</span></div>
        <div class="player p-p" data-player="投手" data-pose="6"><img src="assets/pose_6.png" alt=""><span>投手</span></div>
        <div class="player p-c" data-player="捕手" data-pose="1"><img src="assets/pose_1.png" alt=""><span>捕手</span></div>
        <div class="player p-bench" data-player="ベンチ" data-pose="3"><img src="assets/pose_3.png" alt=""><span>ベンチ</span></div>
      </div>
    </section>
    <nav class="bottom-nav">
      <button class="active" data-page="ホーム">🏟️<small>ホーム</small></button>
      <button data-page="選手一覧">👥<small>選手</small></button>
      <button data-page="チーム">📋<small>チーム</small></button>
      <button data-page="成績">📊<small>成績</small></button>
      <button data-page="記録">📖<small>記録</small></button>
    </nav>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
